      </figure>

    <script>
      (function () {
        var places = [
    { key: "london", en: "London, UK", zh: "英国 伦敦" },
    { key: "hallstatt", en: "Hallstatt, Austria", zh: "奥地利 哈尔施塔特" },
    { key: "matterhorn", en: "Zermatt and the Matterhorn, Switzerland", zh: "瑞士 马特洪峰" },
    { key: "tenerife", en: "Tenerife, Spain", zh: "西班牙 特内里费" },
    { key: "fuji", en: "Mount Fuji, Japan", zh: "日本 富士山" },
    { key: "orlando", en: "Orlando, USA", zh: "美国 奥兰多" },
    { key: "bergen", en: "Bergen, Norway", zh: "挪威 卑尔根" },
    { key: "cambridge", en: "Cambridge, UK", zh: "英国 剑桥" },
    { key: "barcelona", en: "Barcelona, Spain", zh: "西班牙 巴塞罗那" },
    { key: "honolulu", en: "Honolulu, USA", zh: "美国 檀香山" },
    { key: "antalya", en: "Antalya, Türkiye", zh: "土耳其 安塔利亚" },
    { key: "cairo", en: "Cairo, Egypt", zh: "埃及 开罗" },
    { key: "mauna-kea", en: "Mauna Kea, USA", zh: "美国 冒纳凯阿火山" },
    { key: "san-francisco", en: "San Francisco, USA", zh: "美国 旧金山" },
    { key: "las-vegas", en: "Las Vegas, USA", zh: "美国 拉斯维加斯" },
    { key: "los-angeles", en: "Los Angeles, USA", zh: "美国 洛杉矶" },
    { key: "dublin", en: "Dublin, Ireland", zh: "爱尔兰 都柏林" },
    { key: "galway", en: "Galway, Ireland", zh: "爱尔兰 戈尔韦" },
    { key: "murren", en: "Mürren, Switzerland", zh: "瑞士 米伦" }
        ];
        var box = document.getElementById('lightbox');
        var img = document.getElementById('lb-img');
        var en = document.getElementById('lb-en');
        var zh = document.getElementById('lb-zh');
        var current = 0;
        var lastFocus = null;

        function show(i) {
          current = (i + places.length) % places.length;
          var p = places[current];
          img.src = 'images/us/' + p.key + '.jpg';
          img.alt = p.en + ' — Yao and Ci';
          en.textContent = p.en;
          zh.textContent = p.zh;
        }
        function open(key) {
          for (var i = 0; i < places.length; i++) if (places[i].key === key) show(i);
          lastFocus = document.activeElement;
          box.hidden = false;
          document.body.style.overflow = 'hidden';
          box.querySelector('.lb-close').focus();
        }
        function close() {
          box.hidden = true;
          document.body.style.overflow = '';
          if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        document.querySelectorAll('.pin, .chip').forEach(function (el) {
          el.addEventListener('click', function () { open(el.getAttribute('data-key')); });
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(el.getAttribute('data-key')); }
          });
        });
        box.querySelector('.lb-close').addEventListener('click', close);
        box.querySelector('.lb-prev').addEventListener('click', function () { show(current - 1); });
        box.querySelector('.lb-next').addEventListener('click', function () { show(current + 1); });
        box.addEventListener('click', function (e) { if (e.target === box) close(); });
        document.addEventListener('keydown', function (e) {
          if (box.hidden) return;
          if (e.key === 'Escape') close();
          else if (e.key === 'ArrowLeft') show(current - 1);
          else if (e.key === 'ArrowRight') show(current + 1);
        });
      })();
    </script>
